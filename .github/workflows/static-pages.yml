name: Deploy static site to GitHub Pages

# Post-approval only: this workflow is included to shorten an approved no-spend
# GitHub Pages launch. It should run only inside the concrete non-personal
# Northsignal Labs repository approved in APPROVAL-HANDOFF-FIELDS.json.
# It does not add analytics, forms, payments, contact capture, or paid services.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved static package
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
